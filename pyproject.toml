[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "persona-capsule"
version = "0.1.0"
description = "A portable, composable, collectible communication persona."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "gradio[oauth]>=6.0.1,<7",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[project.scripts]
persona-capsule = "persona_capsule.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/persona_capsule"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
